name: QISU HUB standalone desktop
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the ZIP downloads
        required: false
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: qisu-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run build
      - run: python -m pip install PyInstaller==6.22.3
      - name: Build runtime and verify bundled resources
        run: python scripts/build_native.py --output release/native
      - uses: actions/upload-artifact@v4
        with:
          name: qisu-hub-native-${{ matrix.artifact }}
          path: release/native/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qisu-hub-native-*
          merge-multiple: true
          path: release/native
      - name: Add desktop packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QISU_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$QISU_RELEASE_TAG" >/dev/null 2>&1 || gh release create "$QISU_RELEASE_TAG" --verify-tag --title "耆宿说数字工作台 QISU HUB $QISU_RELEASE_TAG" --generate-notes || gh release view "$QISU_RELEASE_TAG" >/dev/null
          gh release upload "$QISU_RELEASE_TAG" release/native/* --clobber
