name: QISU HUB Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: qisu-hub-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - run: npm run check && npm run build
      - run: python scripts/verify_package.py
      - name: Prepare the local-first static entry
        run: |
          mkdir -p pages
          cp -R dist/. pages/
          cp dist/app.html pages/index.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
