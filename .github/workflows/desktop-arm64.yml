name: QISU HUB Apple Silicon recovery build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to build and receive this download
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: qisu-native-arm64-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: macOS Apple Silicon on macOS 26
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Apple Silicon runtime
        run: python -c "import platform; assert platform.machine().lower() == 'arm64', platform.machine()"
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run build
      - run: python -m pip install PyInstaller==6.22.3
      - name: Build runtime and verify bundled resources
        run: python scripts/build_native.py --output release/native
      - uses: actions/upload-artifact@v4
        with:
          name: qisu-hub-native-macos-arm64-latest
          path: release/native/*
          if-no-files-found: error
          retention-days: 30
      - name: Add package to the existing release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QISU_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$QISU_RELEASE_TAG" >/dev/null
          gh release upload "$QISU_RELEASE_TAG" release/native/* --clobber
