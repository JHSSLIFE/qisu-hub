item('s2','source','晋北古建田野手册','这是一份虚拟田野调查材料，不对应真实勘察结论。\n\n## 调查记录\n调查一座古建筑，首先记录位置、朝向、平面、结构和保存状况，再核对碑刻、地方志与历次修缮记录。照片应保留拍摄位置与日期。',{category:'古建调查',status:'已整理'}),
item('s3','source','古建术语整理卡','这是一份虚拟术语整理材料。\n\n## 开间与进深\n开间通常用于描述建筑正面柱列之间的空间分段，进深描述纵深方向。测量时应明确采用柱中线还是构件外缘。',{category:'营造制度',status:'已整理'}),
item('s4','source','文献与图像互证工作单','这是一份虚拟资料考证工作单。\n\n## 证据层次\n原始档案、实测记录、历史照片、研究文章各自回答不同问题。引用时应记录作者、题名、版本、页码或段落，区分原文陈述与研究者推断。',{category:'资料考证',status:'已整理'}),
item('s5','source','遗产保护讨论纪要','这是一份虚拟访谈纪要，人物与发言均为示例。\n\n## 保护与使用\n保护古建筑应关注材料、工艺、空间与使用情境。记录传统工艺时，不仅记录动作，也记录材料选择、工具与工匠的判断依据。',{category:'保护与传承',status:'已整理'}),
item('s6','source','园林与聚落观察笔记','这是一份虚拟空间研究笔记。\n\n## 园林观察\n借景、对景、框景等术语帮助观察空间组织，具体分析仍需回到场地、路径、季节与视线。',{category:'地域与空间',status:'已整理'}),
item('k1','knowledge','斗拱：木构建筑的承托与秩序','斗拱不是一种孤立的装饰，而是一组相互配合的木构件。\n\n## 观察要点\n从位置、层次与组合关系入手，观察斗、拱及相关构件如何组织。将柱头、柱间的做法分别记录，并结合梁架与出檐理解整体。\n\n## 研究提醒\n同一建筑可能经历多次修缮。仅凭斗拱形态判断年代需要谨慎。',{category:'构件与结构',era:'宋代',place:'山西',tags:['斗拱','木构','营造法式'],relatedIds:['k2','k3','k7'],sourceIds:['s1'],favorite:true}),
item('k2','knowledge','榫卯：木构件的连接智慧','榫与卯通过构件之间的几何配合形成连接。记录榫卯时，应同时描述受力方向、构件位置与加工方式。\n\n## 资料整理\n正面照片、侧面照片与简明示意图应对应同一编号。不要把不同部位的榫卯名称混为一谈。',{category:'构件与结构',era:'跨时代',tags:['榫卯','传统工艺'],relatedIds:['k1','k3'],sourceIds:['s1']}),
item('k3','knowledge','抬梁式与穿斗式木构架','抬梁与穿斗是观察传统木构架的常用分类。\n\n## 阅读框架\n对照柱、梁、檩之间的支承与连接关系，再观察空间跨度与用材。具体实例中可能存在混合做法。',{category:'构件与结构',era:'跨时代',tags:['梁架','抬梁','穿斗'],relatedIds:['k1','k2'],sourceIds:['s1']}),
item('k4','knowledge','佛光寺东大殿：一份调查提纲','本条是围绕佛光寺东大殿设置的虚拟研究提纲，不是实测报告。\n\n## 研究入口\n分别整理建筑形制、梁架、斗拱、彩画与历史文献。对每条年代陈述核对出处。',{category:'古建档案',era:'唐代',place:'山西·五台',status:'待考证',tags:['佛光寺','唐代木构','田野调查'],relatedIds:['k1','k5','k13'],sourceIds:['s2']}),
item('k5','knowledge','南禅寺大殿：建筑观察卡','这是一份虚拟建筑观察卡。\n\n## 观察维度\n按平面、立面、梁架、斗拱与保存状况分层记录。为资料注明拍摄或出版时间。',{category:'古建档案',era:'唐代',place:'山西·五台',tags:['南禅寺','古建调查'],relatedIds:['k4','k1'],sourceIds:['s2']}),
item('k6','knowledge','应县木塔：结构阅读路径','本条提供虚拟的木塔结构研究路径。\n\n## 研究切入\n从层间关系、柱网组织与构件连接建立问题清单。区分建筑外观层次和内部结构层次。',{category:'古建档案',era:'辽代',place:'山西·应县',tags:['木塔','结构'],relatedIds:['k1','k3'],sourceIds:['s2']}),
item('k7','knowledge','《营造法式》的阅读方法','阅读营造文献，应先确认所用版本，再建立术语与图样的对应关系。\n\n## 建议步骤\n先选一个具体构件问题，再查相关条文与图样；保留原文、解释与个人疑问三个层次。',{category:'营造制度',era:'宋代',tags:['营造法式','古籍'],relatedIds:['k1'],sourceIds:['s3']}),
item('k11','knowledge','彩画：层次、图案与修缮','彩画记录应关注位置、层次、图案及可见修缮痕迹。\n\n## 整理方法\n统一照片色彩与拍摄距离，保留局部细节和整体位置的对应。',{category:'传统工艺',era:'跨时代',status:'待考证',tags:['彩画','修缮'],relatedIds:['k4','k18'],sourceIds:['s5']}),
item('k12','knowledge','碑刻、地方志与建筑年代','碑刻记载与建筑现存构件可能对应不同历史阶段。\n\n## 核对顺序\n识别原文中的创建、重修、重建等表述，再核对记录对象与时间。',{category:'资料考证',era:'跨时代',status:'待考证',tags:['碑刻','年代'],relatedIds:['k13','k15'],sourceIds:['s4']}),
item('k13','knowledge','古建筑田野调查清单','一份可复用的调查清单：\n\n- 基础信息：位置、朝向、用途\n- 空间信息：平面、开间、进深\n- 构造信息：柱网、梁架、斗拱\n- 保存状况：材料、病害、修缮\n- 证据归档：照片编号、来源和日期\n\n观察事实与研究判断分开填写。',{category:'研究方法',era:'当代',tags:['田野调查','测绘','档案'],relatedIds:['k4','k12'],sourceIds:['s2']}),
item('k15','knowledge','如何建立可追溯的引用','可追溯的引用应让另一位读者找到同一段资料。\n\n## 最小记录\n题名、作者、版本、页码或段落，以及引用原文。网络资料还应记录链接和访问日期。',{category:'研究方法',era:'当代',tags:['引用','溯源'],relatedIds:['k12','k20'],sourceIds:['s4']}),
item('k17','knowledge','最小干预：保护问题清单','本条提供保护讨论中的问题清单，不是具体工程建议。\n\n## 讨论重点\n先确认价值与现状，区分必要干预与展示需求。',{category:'保护与传承',era:'当代',tags:['遗产保护'],relatedIds:['k6','k18'],sourceIds:['s5']}),
item('k18','knowledge','传统工匠口述资料整理','整理口述资料，应保留受访者原话、上下文和整理者说明。\n\n## 记录维度\n材料选择、工具、操作步骤、判断依据与地方术语。涉及公开传播时，另行确认授权范围。',{category:'传统工艺',era:'当代',tags:['工匠','口述史'],relatedIds:['k2','k11','k17'],sourceIds:['s5']}),
item('k19','knowledge','园林中的借景与框景','借景与框景提供观察园林空间的角度。\n\n## 实地观察\n沿真实游览路径记录视线、场地高差和季节条件。用路径图关联照片，不把术语直接替代空间分析。',{category:'地域与空间',era:'明清',tags:['园林','空间'],relatedIds:['k21','k22'],sourceIds:['s6']}),
item('k20','knowledge','面向公众的古建内容写作','好的公众表达可以清晰而严谨。\n\n## 写作结构\n从一个可观察的问题出发，解释构件或空间，再交代资料出处与仍有争议的部分。',{category:'内容传播',era:'当代',tags:['科普','内容创作'],relatedIds:['k15','k1'],sourceIds:['s5']}),
item('k21','knowledge','传统聚落的空间观察','传统聚落包含建筑、街巷、水系、公共空间和日常生活。\n\n## 调查框架\n分别记录空间形态、使用活动与地方叙述，再建立彼此关联。',{category:'地域与空间',era:'跨时代',relatedIds:['k19','k22'],sourceIds:['s6']}),
item('k22','knowledge','院落：从平面到日常生活','院落研究不只关注平面形式，也关注路径、采光和使用方式。\n\n## 观察清单\n入口、庭院、房间、廊道之间如何连接？不同时间谁在使用这些空间？',{category:'地域与空间',era:'明清',relatedIds:['k19','k21'],sourceIds:['s6']}),
item('k23','knowledge','古建数字档案的命名与归档','稳定的命名和版本记录有助于长期保存资料。\n\n## 归档约定\n为建筑、构件与文件建立编号，原始资料与整理稿分开。',{category:'研究方法',era:'当代',relatedIds:['k13','k15'],sourceIds:['s4']}),

item('v1','evidence','能否仅凭斗拱判断建筑年代？','## 当前判断\n不能只依据斗拱形态给出确定年代。需要同时核对现存构件、修缮记录和文献。\n\n## 下一步\n补充真实测绘资料和可靠出版物，再判断。',{status:'待核实',relatedIds:['k1','k4'],sourceIds:['s1'],projectId:'p1',citations:[{id:'s1',version:1,title:'木构营造读书札记',quote:'研究斗拱时应结合时代、位置、构件组合及修缮记录，不能仅凭一张照片推断建筑年代。',stance:'support'}]}),
item('v2','evidence','碑刻所记是初建还是重修？','## 待解决问题\n一条年代记录可能指向创建，也可能指向后世重修。\n\n## 分歧记录\n应保留碑文原词与构件观察，避免过早合并结论。',{status:'存在争议',relatedIds:['k12'],sourceIds:['s4'],projectId:'p1',citations:[{id:'s4',version:1,title:'文献与图像互证工作单',quote:'原始档案、实测记录、历史照片、研究文章各自回答不同问题。',stance:'conflict'}]}),
item('v3','evidence','引用卡应保留哪些信息？','## 整理判断\n引用保留题名、来源版本、段落定位与摘录，便于其他研究者复查。\n\n本记录仅验证示例资料内部的一致性，不代表学术审定。',{status:'有依据',relatedIds:['k15','k23'],sourceIds:['s4'],projectId:'p1'}),
item('d1','draft','斗拱，不止是屋檐下的精巧','## 从屋檐下的一组木构件说起\n当我们抬头看向古建筑的屋檐，常常会注意到层层叠叠的斗拱。它们怎样组织，又应该怎样观察？\n\n## 把构件放回整体\n理解斗拱，需要同时观察它所在的位置、与梁架的关系，以及建筑经历过的修缮。',{format:'科普文章',status:'草稿',relatedIds:['k1','k20'],sourceIds:['s1'],projectId:'p2'}),
item('d2','draft','一场古建田野调查，从什么开始？','## 先把问题带到现场\n古建调查可以从一份清晰的清单开始。位置、朝向、平面和保存状况，是建立档案的起点。\n\n## 让照片与笔记对应\n记录每张照片的构件位置和日期，把观察事实与个人判断分开保存。',{format:'研究提纲',status:'待审阅',relatedIds:['k13'],sourceIds:['s2'],projectId:'p1'}),

async function loginSubmit(){
 const f=$('#login-form');if(!f)return;const fd=new FormData(f);
 const btn=f.querySelector('button[type=submit]');
 const wait=(txt)=>{if(btn){btn.disabled=true;btn.textContent=txt;}};
 loginError='';
 try{
  if(loginMethod==='password'){
   const n=String(fd.get('username')||'').trim(),p=String(fd.get('password')||'');
   loginValues.username=n;loginValues.password=p;
   if(!/^[A-Za-z0-9._-]{3,64}$/.test(n)){loginError='用户名需为 3–64 位字母、数字、点、下划线或短横线';renderLogin();return;}
   if(p.length<6||p.length>72){loginError='密码长度应为 6–72 位';renderLogin();return;}
   wait('正在验证…');
   await qisuApi.loginPassword(n,p);
  }else{
   const c=String(fd.get('code')||'').toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,16);
   loginValues.code=c;
   if(!/^[0-9A-Z]{6,16}$/.test(c)){loginError='邀请码为 6–16 位字母或数字';renderLogin();return;}
   wait('正在验证…');
   await qisuApi.loginExpertCode(c);
  }
  await bootFromServer();
  enter(session);
 }catch(err){
  loginError=(err&&err.message)||'登录失败，请重试';
  renderLogin();
 }
}

function knowledge(){let tab=nav.tab||knowTabs[0],list=by('knowledge');if(tab==='原始资料')list=by('source');if(tab==='数字资产')list=by('asset');if(tab==='收藏')list=all().filter(r=>r.favorite);let body='';if(tab==='知识图谱')body=graph();else if(tab==='建筑解读')body=building();else if(tab==='专题知识库'){const cats=[...new Set(by('knowledge').map(r=>r.category).filter(Boolean))];body=`<div class="cards">${cats.map((c,i)=>`<button class="open-card" data-topic="${esc(c)}"><div class="visual">${art(i%2?'book':'building',colors[i%6])}</div><h2>${esc(c)}</h2><p>${by('knowledge').filter(r=>r.category===c).length} 条知识资料 · 查看专题 ↗</p></button>`).join('')}</div>`;}else{const f=filtered(list);body=filterBar(list,true,tab==='全部知识')+`<p class="quiet">${f.length} 条资料 ${tab==='数字资产'?'· 可导入图片、音频、视频和 PDF（单文件最多 1MB）':''}</p>`+(tab==='数字资产'?`<div class="cards">${f.map((r,i)=>`<button class="open-card" data-open="${r.id}"><div class="visual">${r.assetData&&r.mime?.startsWith('image/')?`<img class="asset-preview" alt="${esc(r.title)}" src="${esc(r.assetData)}">`:r.assetType==='illustration'?art():`<span style="font-size:36px">${r.mime?.startsWith('audio/')?'♪':r.mime?.startsWith('video/')?'▶':r.mime==='application/pdf'?'PDF':'文'}</span>`}</div><h2>${esc(r.title)}</h2><p>${esc(r.category)} · ${ex(r)}</p></button>`).join('')||'<p class="quiet">暂无资产。</p>'}</div>`:nav.view==='grid'?`<div class="cards">${f.map((r,i)=>`<button class="open-card" data-open="${r.id}"><div class="visual">${art(i%2?'book':'building',catColor(r.category))}</div><h2>${esc(r.title)}</h2><p>${esc(r.category)} · ${ex(r)}</p>${tags(r)}</button>`).join('')||'<p class="quiet">没有匹配资料。</p>'}</div>`:rows(f));}return title('Knowledge Center','知识的万千面貌。','从一篇笔记到一座知识库，让每一份资料都有自己的位置。',btn('导入资料','data-import')+(!isExpert()?btn('文献识别 / OCR','data-ds-ocr'):'')+btn(tab==='数字资产'?'＋ 导入资产':'＋ 新建资料',tab==='数字资产'?'data-asset-upload':`data-new="${tab==='原始资料'?'source':'knowledge'}"`,true))+tabs(knowTabs,tab)+body;}
const expertTabs=['人物概览','学术足迹','人物谱系','学术成果','口述历史','原始档案'];
const eventThemes=['考古与田野','古建与文物保护','职业履历','学术成果','学术交流','人生经历'];
function expert(){if(nav.id){const r=find(nav.id);if(r?.kind==='expert')return expertDetail(r);return detail(r);}let list=filtered(by('expert'));return title('People & Perspectives','一代人的学术记忆。','记录的不只是名字，更是理解世界的方式。',btn('＋ 新增专家','data-new="expert"',true))+`<div class="notice">当前空间内的专家档案为系统示例，用于演示档案关联；接入真实资料前请先核验。</div>`+filterBar(by('expert'),true)+`<div class="person-grid">${list.map((r,i)=>`<article class="person-card"><button data-open="${r.id}" style="text-align:left"><div class="person-symbol" style="--c:${colors[(i+2)%6]}">${esc(r.title.slice(-1))}</div><div class="eyebrow">ARCHIVE / ${String(i+1).padStart(2,'0')}</div><h2>${esc(r.title)}</h2></button><p>${esc(r.role||r.category)}</p><p>“${esc(r.quote||'研究观点待补充')}”</p>${ex(r)}<div>${action('查看档案 ↗',`data-open="${r.id}"`)}</div></article>`).join('')||'<p class="quiet">没有匹配的专家。</p>'}</div>`;}
function yearOrder(r){const m=String(r.year||'').match(/\d{4}/);return m?Number(m[0]):Infinity;}
function renderTimeline(r,events){let list=events.filter(x=>!nav.theme||x.category===nav.theme).sort((a,b)=>yearOrder(a)-yearOrder(b));let mode=nav.timeline||'策展';const entry=(x,i)=>{const c=colors[Math.max(0,eventThemes.indexOf(x.category))%6],links=[...new Set([...(x.relatedIds||[]),...(x.sourceIds||[])])].map(find).filter(Boolean);return `<article class="axis-event ${i%2?'reverse':''}" style="--event-color:${c}" id="event-${esc(x.id)}"><div class="axis-date"><time>${esc(x.year||'年代待核')}</time><i aria-hidden="true"></i></div><div class="axis-story"><div class="event-meta">${topic(x.category||'未分类',c)} · ${status(x.status)}</div><button class="axis-title" data-open="${esc(x.id)}">${esc(x.title)} <span aria-hidden="true">↗</span></button>${mode!=='编年'?`<p>${esc(x.body)}</p>`:''}<div class="event-actions">${action('事件详情与出处',`data-open="${esc(x.id)}"`)}${isExpert()?'':action('编辑',`data-edit="${esc(x.id)}"`)}</div></div>${mode!=='编年'?`<aside class="axis-related">${links.length?`<div class="eyebrow">关联线索 / RELATED</div>${links.map(l=>`<button data-open="${esc(l.id)}" class="axis-link"><span>${esc(labels[l.kind])}</span>${esc(l.title)} ↗</button>`).join('')}`:'<span class="quiet">尚未关联原始档案</span>'}</aside>`:''}</article>`;};return `<div class="timeline-toolbar"><div class="filterbar"><select id="event-theme" aria-label="学术主题">${opts(eventThemes,nav.theme,'全部主题')}</select><div class="timeline-switch" role="group" aria-label="时间轴视图">${['策展','编年','主题'].map(t=>`<button data-timeline="${t}" aria-pressed="${mode===t}">${t}视图</button>`).join('')}</div>${isExpert()?'':btn('＋ 新增事件',`data-new="event" data-expert="${r.id}"`)}</div><div class="timeline-summary"><span>${list.length} 个事件 · ${mode==='主题'?'按主题分组，组内按时间排序':'按起始年份升序排列'} · 非等比例</span>${list.length?`<label>跳转 <select id="jump-event"><option value="">选择年份</option>${list.map(x=>`<option value="${esc(x.id)}">${esc(x.year||'待核')} · ${esc(x.title)}</option>`).join('')}</select></label>`:''}</div></div>${list.length?(mode==='主题'?[...new Set(list.map(x=>x.category))].map(c=>`<section class="axis-group"><h2>${esc(c||'未分类')}</h2><div class="living-axis chronological">${list.filter(x=>x.category===c).map(entry).join('')}</div></section>`).join(''):`<div class="living-axis ${mode==='编年'?'chronological':''}">${list.map(entry).join('')}</div>`):'<div class="empty">没有匹配的学术事件。请调整主题或新增事件。</div>'}`;}
function expertDetail(r){const t=nav.tab||'人物概览',events=by('event').filter(x=>x.expertId===r.id).sort((a,b)=>yearOrder(a)-yearOrder(b)||String(a.year).localeCompare(String(b.year))),orals=by('oral').filter(x=>x.expertId===r.id);let body='';if(t==='人物概览'){body=`<div class="story"><article class="reading">${md(r.body)}<blockquote>“${esc(r.quote||'研究观点尚待补充')}”</blockquote></article><aside class="inspect"><h3>档案索引</h3>${['学术足迹','人物谱系','学术成果','口述历史','原始档案'].map(x=>`<button class="record" data-tab="${x}">${x}<span class="end">↗</span></button>`).join('')}<h3 style="margin-top:25px">关联知识</h3>${rows(rel(r).slice(0,5))}</aside></div>`;}else if(t==='学术足迹'){body=renderTimeline(r,events);}else if(t==='人物谱系'){const others=[...new Set(events.flatMap(x=>x.relatedIds||[]).concat(r.relatedIds||[]))].map(find).filter(x=>x?.kind==='expert');body=`<div class="notice">仅展示记录中存在的关联，不自动推断师承或因果关系。</div>${others.length?`<div class="graph-canvas"><svg viewBox="0 0 600 300" style="min-height:0"><circle cx="300" cy="150" r="42" fill="${colors[2]}"/><text x="300" y="155" text-anchor="middle" font-size="20">${esc(r.title)}</text>${others.map((x,i)=>{let xx=100+(i%2)*400,yy=70+Math.floor(i/2)*170;return `<path d="M300 150Q${xx} 150 ${xx} ${yy}" stroke="${colors[4]}" fill="none" stroke-width="2"/><g class="graph-node" data-open="${x.id}" tabindex="0" role="button"><circle cx="${xx}" cy="${yy}" r="33" fill="${colors[4]}"/><text x="${xx}" y="${yy+4}" text-anchor="middle">${esc(x.title)}</text></g>`}).join('')}</svg></div>${rows(others)}`:'<div class="empty">尚无明确人物关联。</div>'}${action('编辑人物关联 ↗',`data-edit="${r.id}"`)}`;}else if(t==='学术成果'){body=section('成果与研究关联')+rows([...events.filter(x=>x.category==='学术成果'),...rel(r).filter(x=>['knowledge','draft'].includes(x.kind))]);}else if(t==='口述历史'){body=section('访谈及整理稿',btn('进入口述工作室 ↗',`data-oral-profile="${esc(r.id)}"`))+oralList(orals);}else{body=section('原始档案与关联出处')+rows([...new Set([...(r.sourceIds||[]),...events.flatMap(x=>x.sourceIds||[])])].map(find).filter(Boolean));}return `<button class="back" data-back>← 返回专家中心</button><div class="eyebrow">EXPERT ARCHIVE / ${ex(r)}</div><div class="profile"><div><h1><span class="underline">${esc(r.title)}</span>${r.birth?`<span class="life">${esc(r.birth)} —</span>`:''}</h1><p>${esc(r.role||r.category)} · ${esc(r.category)}</p><div class="actions">${action('编辑档案',`data-edit="${r.id}"`)}${action(r.favorite?'★ 已收藏':'☆ 收藏',`data-star="${r.id}"`)}${action('导出',`data-export="${r.id}"`)}</div></div><div class="portrait" aria-label="档案姓名索引，非肖像"><span>${esc(r.title.slice(0,1))}</span><small>姓名索引 / INDEX</small></div></div>${tabs(expertTabs,t)}${body}`;}
const researchTabs=['研究专题','资料考证','研究笔记','任务管理','阶段成果'];
function projectRow(p){let a=progress(p);return `<div class="project-item"><div><span class="quiet">${topic(p.category||'研究专题',colors[4])} · ${status(p.status)}</span><button data-open="${p.id}" class="event-title">${esc(p.title)} ↗</button><p>${esc(p.body)}</p><span class="quiet">计划完成：${date(p.due)}</span></div><div><div class="big">${a.percent}%</div><div class="progress"><i style="width:${a.percent}%"></i></div><span class="quiet">${a.done} / ${a.total} 项已完成</span></div></div>`;}
function taskBoard(ts){return `<div class="board">${['待开始','进行中','已完成'].map((s,i)=>`<section class="board-col" style="--c:${['#888',colors[4],colors[5]][i]}"><h3>${s} · ${ts.filter(t=>t.status===s).length}</h3>${ts.filter(t=>t.status===s).map(t=>`<div class="task"><button data-open="${t.id}">${esc(t.title)} ↗</button><div class="quiet">${esc(find(t.projectId)?.title||'未归属项目')}</div><select data-task="${t.id}" aria-label="${esc(t.title)}状态">${states.task.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<p class="quiet">暂无任务</p>'}</section>`).join('')}</div>`;}
function research(){if(nav.id){let r=find(nav.id);return r?.kind==='project'?projectDetail(r):detail(r);}let t=nav.tab||researchTabs[0],body='';if(t==='研究专题')body=filterBar(by('project'),true)+filtered(by('project')).map(projectRow).join('');if(t==='资料考证')body=metrics([['待核实',by('evidence').filter(r=>r.status==='待核实').length,colors[1],'research','资料考证'],['有依据',by('evidence').filter(r=>r.status==='有依据').length,colors[5],'research','资料考证'],['存在争议',by('evidence').filter(r=>r.status==='存在争议').length,colors[3],'research','资料考证']])+filterBar(by('evidence'),false)+rows(filtered(by('evidence')));if(t==='研究笔记')body=filterBar(by('note'),false)+rows(filtered(by('note')));if(t==='任务管理')body=taskBoard(by('task'));if(t==='阶段成果')body=rows([...by('evidence').filter(r=>r.status==='有依据'),...by('draft').filter(r=>r.status==='已完成'||r.status==='待审阅')]);let kind=({'研究专题':'project','资料考证':'evidence','研究笔记':'note','任务管理':'task','阶段成果':'draft'})[t];return title('Research Center','从问题，走向新的认识。','保留证据、保留分歧，让研究过程本身成为值得信任的记录。',btn('＋ 新建'+labels[kind],`data-new="${kind}"`,true))+tabs(researchTabs,t)+body;}
function projectDetail(p){let t=nav.tab||'任务进展',ts=by('task').filter(x=>x.projectId===p.id),body=t==='任务进展'?taskBoard(ts):t==='关联资料'?rows(rel(p)):t==='研究考证'?rows(by('evidence').filter(x=>x.projectId===p.id)):rows(all().filter(x=>x.projectId===p.id&&['draft','note'].includes(x.kind)));return `<button class="back" data-back>← 返回研究中心</button>${title('Research Project',p.title,p.body,btn('编辑专题',`data-edit="${p.id}"`)+btn('＋ 新增任务',`data-new="task" data-project="${p.id}"`,true))}<div class="quiet">${status(p.status)} · 计划完成 ${date(p.due)} · ${ex(p)}</div>${prog(p)}${tabs(['任务进展','关联资料','研究考证','阶段成果'],t)}${body}`;}
const creationTabs=['全部稿件','人物志','文化文章','视频脚本','课程讲解','成果管理'];
const formatMap={'人物志':['人物志'],'文化文章':['科普文章','研究文章','研究提纲'],'视频脚本':['短视频脚本'],'课程讲解':['课程讲解','展览导览词']};
function creation(){if(nav.id)return detail(find(nav.id));let t=nav.tab||creationTabs[0],list=by('draft');if(formatMap[t])list=list.filter(r=>formatMap[t].includes(r.format));if(t==='成果管理')list=list.filter(r=>['待审阅','已完成','已发布'].includes(r.status));return title('Editorial & Creative Studio','让知识，被更多人看见。','让研究成果回到故事、文章、影像与公共文化。',btn('＋ 开始创作',`data-new="draft" data-format="${esc(formatMap[t]?.[0]||'科普文章')}"`,true))+tabs(creationTabs,t)+(t==='全部稿件'?`<div class="hero" style="border-bottom:1px solid #ddd;padding:10px 0 24px"><div><h2 style="font-size:34px">从知识到故事。</h2><p>从一份原始资料开始，保存引用，组织自己的表达。</p>${action('从知识库寻找素材 ↗','data-nav="knowledge"')}</div>${art('book',colors[3])}</div>`:'')+filterBar(list,false)+rows(filtered(list));}
function assetMedia(r){if(r.originalMediaId)return `<div class="notice">原始文件：${esc(r.fileName||r.title)} · 识别页数 ${r.ocrPages?.length||0} · 人工确认稿与 OCR 原始页结果独立保存。</div><div class="actions"><button class="btn" data-ds-original="${esc(r.id)}">下载原件</button><button class="btn" data-ds-raw="${esc(r.id)}">查看逐页原始识别</button></div>`;if(r.assetType==='illustration')return art();if(!r.assetData)return '<p class="quiet">原始文件尚未导入。</p>';let u=esc(r.assetData);if(r.mime?.startsWith('image/'))return `<img class="asset-preview" src="${u}" alt="${esc(r.title)}">`;if(r.mime?.startsWith('audio/'))return `<audio class="asset-preview" controls src="${u}"></audio>`;if(r.mime?.startsWith('video/'))return `<video class="asset-preview" controls src="${u}"></video>`;return `<a href="${u}" download="${esc(r.fileName||r.title)}">打开或下载原始文件 ↗</a>`;}

function matchedExcerpt(r,q,max=1800){const text=String(r.body||'');if(text.length<=max)return text;const terms=[q,...String(q).match(/[a-zA-Z0-9]+|[\u3400-\u9fff]{2}/g)||[]].filter(Boolean);let idx=-1;for(let term of terms){idx=text.toLowerCase().indexOf(term.toLowerCase());if(idx>=0)break;}let start=Math.max(0,Math.min(text.length-max,idx<0?0:idx-Math.floor(max/4)));if(start>0){let pg=text.lastIndexOf('## 第 ',start);if(pg>=0&&start-pg<240)start=pg;}return (start?'…':'')+text.slice(start,start+max-2)+(start+max-2<text.length?'…':'');}
function ranked(q,scope){let tokens=q.toLowerCase().match(/[\u3400-\u9fff]{2,}|[a-z0-9]+/g)||[];const common=['斗拱','木构','榫卯','年代','建筑','田野','文献','保护','专家','口述','壁画','彩塑','佛光寺','园林','聚落','营造','来源','引用'];tokens=[...new Set([...common.filter(x=>q.includes(x)),...tokens,...tokens.flatMap(t=>[...t].map((c,i)=>t.slice(i,i+2)).filter(x=>x.length===2))])];return all().filter(r=>['knowledge','source','expert','event','oral','asset'].includes(r.kind)&&(!r.oralStudio||r.status==='已确认')&&(r.kind!=='asset'||r.textExtracted===true)&&(!r.externalUrl||r.status==='已整理')&&(scope==='all'||r.kind===scope)).map(r=>({r,score:tokens.reduce((a,t)=>a+(r.title.toLowerCase().includes(t)?4:0)+(r.body.toLowerCase().includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.r);}

async function voiceInput(id){if(speech){if(speech.id===id&&speech.rec?.state==='recording'){speech.rec.stop();return;}stopVoice();return;}if(!aiAvailable()){toast('语音输入需要启动本地服务并配置知识助理服务密钥。');return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('此浏览器无法录音，请使用键盘或通过 localhost 打开。');return;}if(!confirm('语音输入将录制最多 30 秒音频并发送给知识助理语音识别。可能产生费用；请勿发送未经授权的资料。继续？'))return;const el=document.getElementById(id);if(!el)return;const x={id,sid:session.sid,el,base:el.value,chunks:[],cancel:false};speech=x;try{x.stream=await navigator.mediaDevices.getUserMedia({audio:true});if(speech!==x||x.cancel){x.stream.getTracks().forEach(t=>t.stop());return;}x.rec=new MediaRecorder(x.stream);x.rec.ondataavailable=e=>{if(e.data.size)x.chunks.push(e.data)};x.rec.onerror=()=>{toast('录音失败，请重试。');stopVoice()};x.rec.onstop=async()=>{clearTimeout(x.timer);x.stream.getTracks().forEach(t=>t.stop());if(x.cancel||speech!==x)return;try{toast('正在识别语音…');const b=new Blob(x.chunks,{type:x.rec.mimeType});const out=await transcribeBlob(b,()=>{},()=>speech===x&&!x.cancel&&session?.sid===x.sid);if(speech===x&&session?.sid===x.sid&&document.getElementById(id)===x.el){x.el.value=x.base+(x.base?' ':'')+out.text;x.el.dispatchEvent(new Event('input',{bubbles:true}));toast('识别完成，请核对文字后检索。');}}catch(e){if(speech===x)toast('语音识别失败：'+e.message)}finally{if(speech===x)stopVoice()}};x.rec.start();document.querySelector(`[data-voice="${id}"]`)?.setAttribute('aria-pressed','true');toast('正在录音；再次点击麦克风结束，最多 30 秒。');x.timer=setTimeout(()=>{if(x.rec.state==='recording')x.rec.stop()},30000);}catch(e){if(speech===x){stopVoice();toast('无法录音：'+e.message);}}}

function audioDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('浏览器不支持录音原件存储'));return;}const req=indexedDB.open('qisu-v32-oral-media',1);req.onupgradeneeded=()=>req.result.createObjectStore('audio');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function mediaPut(id,blob){let db=await audioDB();return new Promise((resolve,reject)=>{let tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}});}
async function mediaGet(id){let db=await audioDB();return new Promise((resolve,reject)=>{let tx=db.transaction('audio','readonly'),req=tx.objectStore('audio').get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}});}
function writeOral(r){if(!canOral(r.expertId)||r.kind!=='oral')throw Error('无口述档案写入权限');const old=records.find(x=>x.id===r.id);if(old&&(old.kind!=='oral'||old.expertId!==r.expertId||!allowed(old)))throw Error('无权修改此记录');const next={...r,updated:now(),version:(old?.version||0)+1};records=old?records.map(x=>x.id===next.id?next:x):[next,...records];(versions[next.id]??=[]).push(structuredClone(next));if(!persist(true)){records=old?records.map(x=>x.id===old.id?old:x):records.filter(x=>x.id!==next.id);versions[next.id].pop();throw Error('文字档案无法持久化，请检查存储权限或容量。');}audit('口述档案写入',next.title);return next;}

function oralButtons(){let active=recorder&&recorder.state!=='inactive';for(const id of ['oral-upload','oral-profile','oral-agree']){let el=document.getElementById(id);if(el)el.disabled=!!active;}for(const k of ['start','pause','resume','stop']){const b=document.querySelector(`[data-oral-rec=${k}]`);if(b)b.disabled=k==='start'?!!active:k==='pause'?recorder?.state!=='recording':k==='resume'?recorder?.state!=='paused':!active;}const s=$('#oral-state');if(s)s.textContent=active?(recorder.state==='paused'?'已暂停':'正在录音'):'录音未开始';}
async function addAudio(blob,name,p,sid){if(session?.sid!==sid||!canOral(p))throw Error('身份已改变，无法保存录音');if(!blob.size||blob.size>100*1024*1024)throw Error('音频为空或超过 100 MB');const id=uid(),audioId=id+'-audio';await mediaPut(audioId,blob);if(session?.sid!==sid||!canOral(p))throw Error('身份已改变');const r=writeOral(item(id,'oral','口述记录 · '+new Date().toLocaleString('zh-CN'),'',{example:false,version:0,created:now(),expertId:p,status:'待转写',audioId,audioName:name,rawTranscript:'',editedTranscript:'',oralStudio:true}));oralSelected=r.id;render();toast('原始录音已保存，请及时下载备份。');}
async function recordAction(k){if(k==='start'){if(recordPending||recorder&&recorder.state!=='inactive')return;if(!$('#oral-agree')?.checked){toast('请先确认录音同意。');return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('当前浏览器不支持录音，请通过 HTTPS/localhost 或导入文件。');return;}let p=oralProfile,sid=session.sid;recordPending=true;try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});if(session?.sid!==sid||nav.page!=='oral'||oralProfile!==p){recStream.getTracks().forEach(t=>t.stop());return;}recordChunks=[];recorder=new MediaRecorder(recStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{recordPending=true;clearInterval(recTimer);recStream?.getTracks().forEach(t=>t.stop());let b=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});const ext=b.type.includes('mp4')?'m4a':b.type.includes('ogg')?'ogg':'webm';try{await addAudio(b,'oral-'+Date.now()+'.'+ext,p,sid)}catch(e){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='unsaved-recording.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('未保存：'+e.message+'；已尝试下载原件。');oralButtons();}finally{recordPending=false;}};recorder.start(1000);recordStart=Date.now();clearInterval(recTimer);recTimer=setInterval(()=>{let e=$('#oral-clock');let t=Math.floor((Date.now()-recordStart)/1000);if(e)e.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');},500);oralButtons();}catch(e){recStream?.getTracks().forEach(t=>t.stop());toast('麦克风未开启：'+e.message);}finally{recordPending=false;}}else if(recorder){if(k==='pause'&&recorder.state==='recording')recorder.pause();if(k==='resume'&&recorder.state==='paused')recorder.resume();if(k==='stop'&&recorder.state!=='inactive')recorder.stop();oralButtons();}}
async function loadOralPlayback(){if(oralURL){URL.revokeObjectURL(oralURL);oralURL='';}let r=find(oralSelected),el=$('#oral-player');if(!r?.audioId||!el)return;try{let blob=await mediaGet(r.audioId);if(!el.isConnected)return;if(!blob)throw Error('本设备未找到原始录音；请使用原始文件备份。');oralURL=URL.createObjectURL(blob);el.src=oralURL;$('#oral-playback-status').textContent='原件已就绪 · '+(blob.size/1024/1024).toFixed(2)+' MB';}catch(e){if(el.isConnected)$('#oral-playback-status').textContent=e.message;}}
async function oralAsr(r){if(!r||!canOral(r.expertId)||r.rawTranscript||oralBusy)return;if(!aiAvailable()){toast('请启动本地 server.py 并配置知识助理服务密钥。');return;}if(!confirm('将原始录音的处理片段发送至知识助理语音识别，可能产生费用。原件留在本设备，不被覆盖。请确认已取得云端处理授权。继续？'))return;const sid=session.sid;oralBusy=true;render();try{let blob=await mediaGet(r.audioId);if(!blob)throw Error('本地原件缺失。');const valid=()=>session?.sid===sid&&canOral(r.expertId);const d=await transcribeBlob(blob,(i,n)=>{const el=document.querySelector('[data-oral-asr]');if(el)el.textContent=`转写 ${i}/${n}…`;},valid);if(!valid())return;let cur=find(r.id);if(cur.rawTranscript)return;writeOral({...cur,rawTranscript:d.transcript,asrSegments:d.segments,editedTranscript:cur.editedTranscript||d.text,status:'待校对'});toast('知识助理转写完成，请校对并确认。');}catch(e){toast('转写未完成：'+e.message);}finally{oralBusy=false;if(session?.sid===sid&&nav.page==='oral')render();}}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||!session)return;let d=b.dataset;if(!('voice'in d||'aiExport'in d||Object.keys(d).some(k=>k.startsWith('oral'))))return;e.preventDefault();e.stopImmediatePropagation();try{if('voice'in d){voiceInput(d.voice);return;}if('aiExport'in d){let a=nav.answer;if(a?.modelAnswer)download('研究草稿-待复核.md','# '+a.q+'\n\n'+a.modelAnswer+'\n\n## 来源（待核对）\n'+a.hits.filter(allowed).map((r,i)=>`[${i+1}] ${r.title} · 版本 ${r.version} ${r.example?'（虚拟示例）':''}`).join('\n'));return;}if('oralProfile'in d){oralProfile=d.oralProfile;oralSelected='';go('oral');return;}if('oralOpen'in d){let r=find(d.oralOpen);if(r&&canOral(r.expertId)){oralProfile=r.expertId;oralSelected=r.id;if(nav.page!=='oral')go('oral');else render();}return;}if('oralRec'in d){await recordAction(d.oralRec);return;}let id=d.oralDownload||d.oralAsr||d.oralSave||d.oralConfirm||d.oralText,r=find(id);if(!r||!canOral(r.expertId))return;if('oralText'in d){download('口述档案-'+r.id+'.md','# '+r.title+'\n\n状态：'+r.status+'\n版本：'+r.version+'\n原件：'+(r.audioName||'无')+'\n\n## 机器转写原稿\n'+(r.rawTranscript||'无')+'\n\n## 整理稿\n'+(r.editedTranscript??r.body??''));return;}if('oralDownload'in d){let blob=await mediaGet(r.audioId);if(!blob)throw Error('本地原件缺失');let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=r.audioName||'oral.webm';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);return;}if('oralAsr'in d){await oralAsr(r);return;}let text=$('#oral-edited')?.value.trim()||'';if('oralConfirm'in d&&(!text||!confirm('已核对整理稿并同意纳入授权检索？')))return;writeOral({...r,oralStudio:true,editedTranscript:text,body:'oralConfirm'in d?text:'',status:'oralConfirm'in d?'已确认':'待校对'});render();toast('oralConfirm'in d?'已确认并加入知识检索':'整理稿已保存');}catch(e){toast(e.message);}},true);
document.addEventListener('change',async e=>{if(e.target.id==='oral-profile'){oralProfile=e.target.value;oralSelected='';render();}if(e.target.id==='oral-upload'){let f=e.target.files?.[0];if(!f)return;if(!$('#oral-agree')?.checked){toast('请先确认参与者同意。');e.target.value='';return;}try{if(!f.type.startsWith('audio/')&&!/\.(m4a|wav|mp3|webm|ogg)$/i.test(f.name))throw Error('请选择音频文件');await addAudio(f,f.name,oralProfile,session.sid);}catch(e){toast('导入失败：'+e.message);}}});
window.addEventListener('beforeunload',e=>{if(recorder&&recorder.state!=='inactive'){e.preventDefault();e.returnValue='';}});

// 知识助理 All-in-One 工具：所有云端调用均显式触发，需用户确认
async function rawTool(name,blob,headers={},timeout=210000){if(!aiAvailable())throw Error('需要通过本地服务启动。');const res=await fetch('/api/qisu/'+name,{method:'POST',headers:{'Content-Type':'application/octet-stream',...headers},body:blob,signal:AbortSignal.timeout(timeout)});const d=await res.json();if(!res.ok)throw Error(d.error||'请求失败');return d;}
function encodeWav(buffer,start,end){const rate=16000,frames=Math.max(1,Math.floor((end-start)*rate)),out=new ArrayBuffer(44+frames*2),v=new DataView(out);const tag=(offset,t)=>{for(let j=0;j<t.length;j++)v.setUint8(offset+j,t.charCodeAt(j))};tag(0,'RIFF');v.setUint32(4,out.byteLength-8,true);tag(8,'WAVE');tag(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);tag(36,'data');v.setUint32(40,frames*2,true);const chans=Array.from({length:buffer.numberOfChannels},(_,i)=>buffer.getChannelData(i));for(let i=0;i<frames;i++){let pos=(start+i/rate)*buffer.sampleRate,j=Math.min(buffer.length-1,Math.floor(pos)),k=Math.min(buffer.length-1,j+1),f=pos-j;let val=0;for(const c of chans)val+=c[j]*(1-f)+c[k]*f;val=Math.max(-1,Math.min(1,val/chans.length));v.setInt16(44+i*2,val<0?val*32768:val*32767,true);}return new Blob([out],{type:'audio/wav'});}
async function transcribeBlob(blob,progress,valid=()=>true){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('浏览器不支持音频解码，请用 Chrome/Safari。');let ctx=new AC(),buf;try{buf=await ctx.decodeAudioData(await blob.arrayBuffer());}catch{throw Error('此浏览器无法解码该音频，请转换为 WAV 后重新导入。');}finally{await ctx.close().catch(()=>{})}if(!buf.duration||!Number.isFinite(buf.duration))throw Error('无有效音频时长。');const step=90,n=Math.ceil(buf.duration/step),rows=[];for(let i=0;i<n;i++){if(!valid())throw Error('操作已取消或身份改变');const start=i*step,end=Math.min(buf.duration,start+step);progress(i+1,n);try{const d=await rawTool('transcribe',encodeWav(buf,start,end),{},100000);rows.push({start,end,text:d.text,requestId:d.request_id,durationMs:d.duration_ms});}catch(e){throw Error(`片段 ${i+1}/${n} 失败：${e.message}。原件保留，可重新转写。`);}}return {segments:rows,text:rows.map(x=>x.text).join('\n'),transcript:rows.map(x=>`[${x.start.toFixed(1)}–${x.end.toFixed(1)}s · 片段索引] ${x.text}`).join('\n')};}
let dsOCR=null,dsOCRBusy=false,dsWeb=null,dsWebBusy=false,dsTtsURL='';
function dsAllowed(){if(!session||isExpert())return false;return true;}
function cleanOCR(t){return String(t||'').replace(/<｜box｜>[\s\S]*?<｜\/box｜>/g,'').replace(/<｜\/?ref｜>/g,'').trim();}
function showOCR(){if(!dsAllowed())return;dsOCR=null;modal('文献识别 · 知识助理 OCR',`<p class="quiet">导入 PDF、Word、PPT 或图片（Demo 单文件 ≤ 10 MiB）。原件留存于本机，逐页识别结果必须人工校对、确认后入库。</p><label class="formfield">选择原始文献<input id="ds-ocr-file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff"></label><label>识别方式 <select id="ds-ocr-purpose"><option value="text_recognition">文字识别</option><option value="rich_layout_recognition">逐页版面识别</option></select></label><p class="quiet">识别前确认获得文件云端传输授权；接口按成功页数收费。</p><div class="actions"><button class="btn primary" data-ds-ocr-run>识别文献</button></div><p role="status" id="ds-ocr-status"></p><div id="ds-ocr-result"></div>`);}
async function runOCR(){if(!dsAllowed()||dsOCRBusy)return;let f=$('#ds-ocr-file')?.files?.[0],purpose=$('#ds-ocr-purpose')?.value,box=$('#ds-ocr-result'),status=$('#ds-ocr-status');if(!f||!f.size||f.size>10*1024*1024){toast('请选择 10 MiB 以内的文件。');return;}if(!confirm('将此文献发送至知识助理 OCR，可能产生费用。已获授权？'))return;let sid=session.sid;dsOCRBusy=true;status.textContent='正在逐页识别…';box.innerHTML='';try{const d=await rawTool('ocr',f,{'X-Qisu-Filename':encodeURIComponent(f.name),'X-Qisu-Purpose':purpose});if(session?.sid!==sid||!box.isConnected||!dsAllowed())return;if(!d.pages?.length)throw Error('未识别到页面');let text=d.pages.map((x,i)=>`## 第 ${Number(x.index??i)+1} 页${x.finish_reason==='length'?'（识别不完整）':''}\n\n${cleanOCR(x.text)}`).join('\n\n');dsOCR={file:f,result:d,text,sid};status.textContent=`识别 ${d.pages.length} 页 · ${d.pages.filter(x=>x.finish_reason==='length').length} 页输出不完整；请人工核对。`;box.innerHTML=`<label class="formfield">文献标题<input id="ds-ocr-title" value="${esc(f.name)}"></label><label class="formfield">确认文字（保留页码；原始 OCR 另存）<textarea id="ds-ocr-text" rows="12">${esc(text)}</textarea></label><label class="inline-check"><input id="ds-ocr-confirm" type="checkbox"> 已核对文字与页码，确认纳入内部检索</label><div class="actions"><button class="btn primary" data-ds-ocr-save>确认入库并保存原件</button></div>`;}catch(e){if(status.isConnected)status.textContent='识别失败：'+e.message;}finally{dsOCRBusy=false;}}
async function saveOCR(){const d=dsOCR;if(!dsAllowed()||!d||d.sid!==session.sid||!$('#ds-ocr-confirm')?.checked){toast('请先核对并确认。');return;}let text=$('#ds-ocr-text')?.value.trim(),titleText=$('#ds-ocr-title')?.value.trim();if(!text||!titleText){toast('标题与确认文字不能为空。');return;}let id=uid(),originalMediaId=id+'-original';await mediaPut(originalMediaId,d.file);if(!dsAllowed()||session.sid!==d.sid)return;const r=item(id,'asset',titleText,text,{example:false,version:0,category:'已识别文献',status:'已整理',textExtracted:true,originalMediaId,fileName:d.file.name,mime:d.file.type,ocrPages:d.result.pages,ocrRequestId:d.result.id});dsOCR=null;closeModal();save(r);go('knowledge','数字资产');open(id);}
function safeWeb(u){try{let p=new URL(u);return ['http:','https:'].includes(p.protocol)&&!p.username&&!p.password?p.href:'';}catch{return ''}}
function showWeb(){dsWeb=null;modal('外部研究 · 知识助理',`<p class="quiet">默认仍为内部知识库研究。此处明确发起外部搜索或抓取；结果不自动混入内部知识，不自动发送专家资料。</p><label class="formfield">搜索关键词（≤128 字符）<input id="ds-web-query" type="search" maxlength="128" placeholder="例如：中国古建筑测绘"></label><button class="btn primary" data-ds-search>搜索公开网页</button><label class="formfield">或输入公开网页 URL<input id="ds-web-url" type="url" placeholder="https://…"></label><button class="btn" data-ds-fetch>抓取网页正文</button><p role="status" id="ds-web-status"></p><div id="ds-web-result"></div>`);}
async function webTool(mode,url=''){if(!session||dsWebBusy)return;const sid=session.sid,status=$('#ds-web-status'),box=$('#ds-web-result');let q=mode==='search'?$('#ds-web-query')?.value.trim():url||$('#ds-web-url')?.value.trim();if(!q||(mode==='fetch'&&!safeWeb(q))){toast('请填写有效的关键词或公开网址。');return;}if(!confirm('将此关键词或网址发送给知识助理外部网页工具，可能产生费用。继续？'))return;dsWebBusy=true;status.textContent='正在请求…';try{let d=await aiCall(mode,mode==='search'?{query:q}:{url:q});if(session?.sid!==sid||!box.isConnected)return;dsWeb=mode==='search'?d.results.map(x=>({title:String(x.title||'未命名'),url:safeWeb(x.url),text:String(x.content||x.summary||'')})):[{title:d.title||q,url:safeWeb(q),text:d.content||''}];status.textContent=`${dsWeb.length} 条外部结果 · 待人工核实`;box.innerHTML=dsWeb.map((x,i)=>`<article class="citecard"><h3>${esc(x.title)}</h3>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>`:''}<details ${mode==='fetch'?'open':''}><summary>正文 / 摘要</summary><p style="white-space:pre-wrap">${esc(x.text||'没有正文')}</p></details><div class="actions">${mode==='search'&&x.url?`<button class="btn" data-ds-fetch-index="${i}">获取正文</button>`:''}${!isExpert()&&x.text?`<button class="btn" data-ds-web-save="${i}">保存为待整理资料（暂不参与 AI 检索）</button>`:''}</div></article>`).join('')||'<p>暂无结果。</p>';}catch(e){if(status.isConnected)status.textContent='请求失败：'+e.message;}finally{dsWebBusy=false;}}
async function readAloud(){const a=nav.answer;if(!a?.modelAnswer||!session)return;const sid=session.sid;let t=a.modelAnswer;if(t.length>6000){toast('回答超过 6000 字，请缩短后朗读。');return;}if(!confirm('将当前模型回答文本发送至知识助理语音，可能产生费用。继续？'))return;modal('研究回答 · 语音朗读',`<label>音色 <select id="ds-voice-id"><option value="stella">海星 · 女声</option><option value="tide">暗潮 · 男声</option></select></label><button class="btn primary" data-ds-tts-run>生成语音</button><p id="ds-tts-status" role="status"></p><audio id="ds-tts-player" controls></audio>`);}
async function ttsRun(){const el=$('#ds-tts-player'),status=$('#ds-tts-status'),button=$('[data-ds-tts-run]'),sid=session?.sid,text=nav.answer?.modelAnswer;if(!el||!text||!sid)return;if(!aiAvailable()){status.textContent='请启动本地服务。';return;}button.disabled=true;status.textContent='正在合成…';try{const r=await fetch('/api/qisu/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice_id:$('#ds-voice-id').value}),signal:AbortSignal.timeout(150000)});if(!r.ok){let d=await r.json();throw Error(d.error||'合成失败');}const b=await r.blob();if(!el.isConnected||session?.sid!==sid)return;if(dsTtsURL)URL.revokeObjectURL(dsTtsURL);dsTtsURL=URL.createObjectURL(b);el.src=dsTtsURL;status.textContent='语音已生成，请点击播放。';}catch(e){if(status.isConnected)status.textContent=e.message;}finally{if(button.isConnected)button.disabled=false;}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!session)return;const d=b.dataset,k=Object.keys(d).find(x=>x.startsWith('ds'));if(!k)return;e.preventDefault();e.stopImmediatePropagation();try{switch(k){case 'dsOcr':showOCR();break;case 'dsOcrRun':await runOCR();break;case 'dsOcrSave':await saveOCR();break;case 'dsOriginal':{const r=find(d.dsOriginal),blob=r&&await mediaGet(r.originalMediaId);if(!blob||!r||!allowed(r))throw Error('原件不可访问');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.fileName||r.title;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);break;}case 'dsRaw':{const r=find(d.dsRaw);if(r&&allowed(r))modal('逐页 OCR 原始输出',`<p class="quiet">保留原始识别结果及可能的版面定位标记。</p>${(r.ocrPages||[]).map((x,i)=>`<h3>第 ${Number(x.index??i)+1} 页 · ${esc(x.finish_reason||'')}</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.text)}</pre>`).join('')}`);break;}case 'dsWeb':showWeb();break;case 'dsSearch':await webTool('search');break;case 'dsFetch':await webTool('fetch');break;case 'dsFetchIndex':await webTool('fetch',dsWeb?.[Number(d.dsFetchIndex)]?.url);break;case 'dsWebSave':{const x=dsWeb?.[Number(d.dsWebSave)];if(!dsAllowed()||!x||!x.text)return;if(!confirm('将公开网页结果作为待整理来源保存？核实并改为已整理后才纳入 AI 检索。请先确认使用权。'))return;const r=item(uid(),'source',x.title,'来源：'+x.url+'\n抓取日期：'+now()+'\n\n'+x.text,{example:false,version:0,category:'外部研究',status:'待整理',externalUrl:x.url});closeModal();save(r);go('knowledge','原始资料');open(r.id);break;}case 'dsTts':await readAloud();break;case 'dsTtsRun':await ttsRun();break;}}catch(err){toast(err.message);}},true);

 $('.shell').hidden=true;$('#nav-mobile').hidden=true;   // 先藏外壳，避免登录页闪现
 try{const d=await qisuApi.boot();if(d&&d.user){await bootFromServer();enter(session);}else{showLogin();}}
