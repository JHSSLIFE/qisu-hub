services:
  qisu-hub:
    build: .
    ports:
      - "${QISU_HTTP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      QISUSHUO_DATA: /data
    volumes:
      - qisu-hub-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  qisu-hub-data:
